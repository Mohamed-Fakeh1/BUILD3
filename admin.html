<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Build 3 | Dashboard</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%2300b8e6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3E3%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css"><link rel="stylesheet" href="assets/admin-theme.css"></head><body>
<div id="lg"><div class="gl p-4" style="width:min(92%,380px)"><div class="logo">Build 3</div><p class="text-center text-secondary">لوحة التحكم</p><input id="le" type="email" autocomplete="username" class="form-control mb-2" placeholder="Email" onkeydown="if(event.key=='Enter')login()"><div class="pw mb-2"><input id="lp" type="password" autocomplete="current-password" class="form-control" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><span onclick="eye(this)"><i class="bi bi-eye"></i></span></div><div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="lr"><label class="form-check-label small" for="lr">تذكرني على هذا الجهاز</label></div><p id="lm" class="text-danger small mb-2"></p><button class="btn btn-grad w-100" onclick="login()">دخول</button></div></div>
<button id="mb" class="btn btn-grad position-fixed m-2" style="z-index:1040" onclick="$('#sb').classList.toggle('o')"><i class="bi bi-list fs-5"></i></button>
<aside id="sb"><div class="logo">Build 3</div>
<a class="nv a" data-t="dash"><i class="bi bi-speedometer2"></i> الإحصائيات</a><a class="nv" data-t="online"><i class="bi bi-broadcast"></i> المتصلين</a><a class="nv" data-t="orders"><i class="bi bi-inbox"></i> الطلبات <b id="bg"></b></a><a class="nv" data-t="done"><i class="bi bi-check2-circle"></i> مكتمل</a><a class="nv" data-t="clients"><i class="bi bi-people"></i> العملاء</a><a class="nv" data-t="chat"><i class="bi bi-chat-left-text"></i> الشات <b id="bc"></b></a><a class="nv" data-t="messages"><i class="bi bi-envelope"></i> رسائل الفورم <b id="bm"></b></a><a class="nv" data-t="portfolio"><i class="bi bi-images"></i> المعرض</a><a class="nv" data-t="comments"><i class="bi bi-star"></i> التعليقات <b id="bcm"></b></a><a class="nv" data-t="team"><i class="bi bi-person-badge"></i> الفريق</a><a class="nv" data-t="profile"><i class="bi bi-gear"></i> حسابي</a><a class="nv" onclick="api('logout').then(()=>location.reload())"><i class="bi bi-box-arrow-right"></i> خروج</a></aside>
<main class="p-3 p-lg-4 pt-5 pt-lg-4"><div class="mb-4"><div id="hi"></div><small class="text-secondary" id="dt"></small></div><div class="pn on" id="p_dash"></div><div class="pn" id="p_online"></div><div class="pn" id="p_orders"></div><div class="pn" id="p_done"></div><div class="pn" id="p_clients"></div><div class="pn" id="p_messages"></div><div class="pn" id="p_chat"></div>
<div class="pn" id="p_portfolio"><h4 class="mb-3">المعرض</h4><div class="gl p-3 mb-4" style="max-width:520px"><h6>إضافة مشروع</h6><input id="pt" type="text" maxlength="120" class="form-control mb-2" placeholder="اسم المشروع"><textarea id="pd" class="form-control mb-2" rows="3" placeholder="وصف المشروع"></textarea><input id="pu" type="url" class="form-control mb-2" placeholder="رابط Live Demo (اختياري)"><label class="small text-secondary">صور المشروع (الأولى هي الغلاف، تقدر تختار أكتر من صورة)</label><input id="pi" type="file" accept="image/*" multiple class="form-control mb-2"><p id="pm" class="small mb-2"></p><button class="btn btn-grad" onclick="addP()">إضافة</button></div><div class="row g-3" id="pl"></div></div>
<div class="pn" id="p_comments"></div>
<div class="pn" id="p_team"><h4 class="mb-3">الفريق</h4><div class="gl p-3 mb-4" style="max-width:520px"><h6>إضافة عضو (أدمن)</h6><input id="tn" type="text" maxlength="100" class="form-control mb-2" placeholder="الاسم"><input id="te" type="email" maxlength="120" class="form-control mb-2" placeholder="الإيميل"><input id="tt" type="text" maxlength="60" class="form-control mb-2" placeholder="الوظيفة"><div class="pw mb-2"><input id="tp" type="password" autocomplete="new-password" class="form-control" placeholder="كلمة المرور (4 حروف على الأقل)"><span onclick="eye(this)"><i class="bi bi-eye"></i></span></div><p id="tm" class="small mb-2"></p><button class="btn btn-grad" onclick="addA()">إضافة</button></div><div class="row g-3" id="tl"></div></div>
<div class="pn" id="p_profile"><h4 class="mb-3">حسابي</h4><div class="gl p-4" style="max-width:440px"><img id="pp" class="rounded-circle mb-3" style="display:none;width:90px;height:90px;object-fit:cover"><label class="small">الوظيفة</label><input id="ti" type="text" maxlength="60" class="form-control mb-2" placeholder="مثال: Co-Founder"><label class="small">كلمة مرور جديدة (سيبها فاضية لو مش عايز تغيرها)</label><div class="pw mb-2"><input id="np" type="password" autocomplete="new-password" class="form-control"><span onclick="eye(this)"><i class="bi bi-eye"></i></span></div><button type="button" class="btn btn-outline-dark mb-2" onclick="cropPick()"><i class="bi bi-crop"></i> اختيار وقص الصورة</button><p id="fm" class="small mb-2"></p><button class="btn btn-grad" onclick="prof()">حفظ</button></div></div></main>
<button id="afab" onclick="go('chat')" aria-label="Chat" hidden><i class="bi bi-chat-dots-fill"></i><b id="abd" hidden></b></button>
<div class="modal fade" id="gm" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title" id="gt"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="gb"></div><div class="modal-footer border-0" id="gf"></div></div></div></div>
<div class="toast-container position-fixed top-0 start-0 p-3" style="z-index:3000"><div id="tt2" class="toast text-bg-light border-info" data-bs-delay="6000"><div class="toast-body fs-6" id="tb" role="button" onclick="go($('#tb').dataset.go||'orders');bootstrap.Toast.getInstance('#tt2').hide()"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/common.js"></script><script src="assets/admin.js"></script><script src="assets/crop.js"></script><script src="assets/admin-chat.js"></script></body></html>
